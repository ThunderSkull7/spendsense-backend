name: Production Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "YES" to confirm running production migrations on Neon production database (neondb)'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'YES'

permissions:
  contents: read

concurrency:
  group: production-migration
  cancel-in-progress: false

jobs:
  production-migration:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_CONNECTION: pgsql
      DB_HOST: ${{ secrets.POSTGRES_HOST }}
      DB_PORT: ${{ secrets.POSTGRES_PORT }}
      DB_DATABASE: ${{ secrets.POSTGRES_DB }}
      DB_USERNAME: ${{ secrets.POSTGRES_USER }}
      DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      APP_KEY: ${{ secrets.APP_KEY }}
      APP_ENV: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify confirmation input
        if: github.event.inputs.confirm != 'YES'
        run: |
          echo "Migration aborted: confirmation input must be exactly 'YES'."
          exit 1

      - name: Verify required secrets
        run: |
          required_vars=("DB_HOST" "DB_PORT" "DB_DATABASE" "DB_USERNAME" "DB_PASSWORD" "APP_KEY")
          missing=()
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing required configuration: ${missing[*]}"
            exit 1
          fi
          echo "All required configuration values are present"

      - name: Validate target database
        run: |
          expected_host="ep-wandering-mode-aoz8aitl.c-2.ap-southeast-1.aws.neon.tech"
          expected_db="neondb"
          expected_port="5432"

          if [ "$DB_HOST" != "$expected_host" ]; then
            echo "ERROR: DB_HOST does not match the intended direct Neon production host."
            exit 1
          fi

          if [ "$DB_DATABASE" != "$expected_db" ]; then
            echo "ERROR: DB_DATABASE does not match the intended production database."
            exit 1
          fi

          if [ "$DB_PORT" != "$expected_port" ]; then
            echo "ERROR: DB_PORT does not match the intended PostgreSQL port."
            exit 1
          fi

          # Verify it's a direct host, not pooled
          if [[ "$DB_HOST" == *"-pooler"* ]]; then
            echo "ERROR: DB_HOST appears to be a pooled connection. Use the direct Neon host."
            exit 1
          fi

          echo "Target database validation passed."

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, bcmath, xml

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Run preflight checks
        run: |
          set -euo pipefail
          echo "Running preflight checks..."

          # Check for duplicate monthly budget keys
          duplicate_budgets=$(php -r "
            require 'vendor/autoload.php';
            \$app = require_once 'bootstrap/app.php';
            \$app->make('Illuminate\Contracts\Console\Kernel')->bootstrap();

            \$duplicates = DB::table('budgets')
              ->select('user_id', 'category_id')
              ->selectRaw('DATE_TRUNC(\'month\', month_year) as month')
              ->groupBy('user_id', 'category_id')
              ->groupByRaw('DATE_TRUNC(\'month\', month_year)')
              ->havingRaw('COUNT(*) > 1')
              ->get()
              ->count();

            if (\$duplicates > 0) {
              echo 'DUPLICATE_BUDGETS:' . \$duplicates;
            }
          ")

          if [[ "$duplicate_budgets" == *"DUPLICATE_BUDGETS:"* ]]; then
            count="${duplicate_budgets#*DUPLICATE_BUDGETS:}"
            echo "ERROR: Found $count duplicate monthly budget keys. Aborting migration."
            exit 1
          fi

          # Check for non-positive amounts
          negative_amounts=$(php -r "
            require 'vendor/autoload.php';
            \$app = require_once 'bootstrap/app.php';
            \$app->make('Illuminate\Contracts\Console\Kernel')->bootstrap();

            \$neg_incomes = DB::table('incomes')->where('amount', '<=', 0)->count();
            \$neg_expenses = DB::table('expenses')->where('amount', '<=', 0)->count();
            \$neg_budgets = DB::table('budgets')->where('limit_amount', '<=', 0)->count();

            if (\$neg_incomes > 0 || \$neg_expenses > 0 || \$neg_budgets > 0) {
              echo 'NEGATIVE_AMOUNTS:incomes=' . \$neg_incomes . ', expenses=' . \$neg_expenses . ', budgets=' . \$neg_budgets;
            }
          ")

          if [[ "$negative_amounts" == *"NEGATIVE_AMOUNTS:"* ]]; then
            echo "ERROR: Found non-positive amounts: ${negative_amounts#*NEGATIVE_AMOUNTS:}. Aborting migration."
            exit 1
          fi

          echo "Preflight checks passed."

      - name: Run migration status (pre-migration)
        run: php artisan migrate:status --database=pgsql

      - name: Run production migrations
        run: php artisan migrate --force --database=pgsql

      - name: Verify migration status (post-migration)
        run: php artisan migrate:status --database=pgsql

      - name: Verify expected feature tables exist
        run: |
          set -euo pipefail
          php -r "
            require 'vendor/autoload.php';
            \$app = require_once 'bootstrap/app.php';
            \$app->make('Illuminate\Contracts\Console\Kernel')->bootstrap();

            \$tables = [
              'recurring_incomes',
              'recurring_income_occurrences',
              'recurring_expenses',
              'recurring_expense_occurrences',
              'bill_reminders',
              'savings_goals',
              'savings_goal_contributions',
              'budget_alerts',
              'net_worth_entries',
              'net_worth_valuations',
              'subscriptions',
              'idempotency_records',
              'dashboard_preferences',
            ];

            foreach (\$tables as \$table) {
              if (!Schema::hasTable(\$table)) {
                echo 'MISSING TABLE: ' . \$table . \"\n\";
                exit(1);
              }
            }

            // Verify key columns on critical tables
            \$columns = [
              'recurring_expenses' => ['amount', 'frequency', 'status', 'reminder_days_before'],
              'recurring_expense_occurrences' => ['status', 'expense_id', 'paid_at'],
              'savings_goals' => ['target_amount', 'status', 'completed_at'],
              'savings_goal_contributions' => ['type', 'amount'],
              'budget_alerts' => ['threshold', 'spent_amount', 'limit_amount'],
              'subscriptions' => ['recurring_expense_id', 'amount', 'frequency', 'next_renewal_date'],
            ];

            foreach (\$columns as \$table => \$cols) {
              foreach (\$cols as \$col) {
                if (!Schema::hasColumn(\$table, \$col)) {
                  echo 'MISSING COLUMN: ' . \$table . '.' . \$col . \"\n\";
                  exit(1);
                }
              }
            }

            echo 'All feature tables and key columns verified.';
          "
