name: Bug Report
description: Report a bug, broken endpoint, or unexpected API behavior in SpendSense Backend.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible.

        > **Important:** If this is a security vulnerability, please do NOT use this form. Refer to [SECURITY.md](https://github.com/ThunderSkull7/spendsense-backend/blob/main/SECURITY.md) for private reporting procedures. Do not include passwords, API tokens, or real financial data.
  - type: input
    id: environment_version
    attributes:
      label: PHP & Laravel Version
      description: What versions of PHP and Laravel are you running?
      placeholder: "e.g., PHP 8.3.10, Laravel 12.0.1"
    validations:
      required: true
  - type: dropdown
    id: database_driver
    attributes:
      label: Database Driver
      description: Which database driver is active?
      options:
        - SQLite (in-memory / file)
        - PostgreSQL 16+
        - Other (explain in description)
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Affected Endpoint or Component
      description: The route, service, or artisan command involved.
      placeholder: "e.g., POST /api/expenses or BudgetAlertService"
    validations:
      required: false
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Describe the exact steps needed to reproduce the issue.
      placeholder: |
        1. Authenticate via POST /api/login
        2. Send POST /api/expenses with payload: {"amount": 10.00, ...}
        3. Observe response status and payload...
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: "Describe the expected HTTP status, calculation, or database state."
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior & Sanitized Logs
      description: What actually occurred? Include relevant sanitized stack traces, HTTP error bodies, or database errors.
      placeholder: "Paste sanitized output here. Strip all passwords, bearer tokens, or sensitive values."
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Contributor Checklist
      options:
        - label: I have verified that this report does not contain an exploitable security vulnerability.
          required: true
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have removed all passwords, tokens, API keys, and sensitive financial records from this report.
          required: true
